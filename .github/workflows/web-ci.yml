name: Web (Next.js) CI

on:
  push:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Veritabanı rolleri ve test veritabanları
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE academicos_owner LOGIN PASSWORD 'devowner' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE academicos_app LOGIN PASSWORD 'devapp' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE academicos_test OWNER academicos_owner;
          CREATE DATABASE academicos_e2e OWNER academicos_owner;
          SQL
      - name: ffmpeg (ses/video testleri için)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Birim ve entegrasyon testleri (gerçek PostgreSQL)
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-sonuclari
          path: web/test-results
          retention-days: 7
